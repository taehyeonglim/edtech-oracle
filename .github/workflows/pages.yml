name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node --test의 인용 glob이 21+에서 도입됐다. 20으로 고정하면 테스트가 돌지 않는다.
          node-version: 22
          cache: npm
      - run: npm ci
      # 게이트 1 — 근거 무결성. 여기가 빨간데 배포하면 깨진 근거를 예쁘게 포장하는 셈이다.
      - run: npm run lint:strict
      # 게이트 2 — 답변 무결성. 위인이 지어냈거나 자기 페이지 밖에서 인용한 답변은 저장소에 남지 못한다.
      #            형식급(마커·각주 서식)은 경고로만 나온다.
      - run: npm run lint:answers
      # 게이트 3 — 렌더러·색인 회귀
      - run: npm test
      # 게이트 4 — 빌드 내부에서 lint를 다시 돌리고 산출물의 내부 링크를 전수 검사한다
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
